# This repository has no build; only its workflow's actions are pinned to a
# commit and bumped here, on the same weekly schedule as the four Java repos.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
